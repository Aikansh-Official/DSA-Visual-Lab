            - code [ref=e516]: "function insert(root, value) { if (root.keys.length === 2 * T - 1) { const nextRoot = new BTreeNode(false); nextRoot.children[0] = root; splitChild(nextRoot, 0); insertNonFull(nextRoot, value); return nextRoot; } insertNonFull(root, value); return root; } function splitChild(parent, index) { const full = parent.children[index]; const right = new BTreeNode(full.leaf); parent.keys.splice(index, 0, full.keys[T - 1]); right.keys = full.keys.splice(T); full.keys.length = T - 1; parent.children.splice(index + 1, 0, right); }"
